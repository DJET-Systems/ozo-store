{% load static i18n %}
<!doctype html>
{% get_current_language as CURRENT_LANG %}
<html lang="{{ CURRENT_LANG|default:'ar' }}" dir="{% if CURRENT_LANG == 'en' %}ltr{% else %}rtl{% endif %}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% trans "Invalid Invitation" %} — DJET Store</title>
  <link rel="stylesheet" href="{% static 'dashboard/base.css' %}">
</head>
<body>
  <div class="djet-auth-shell">
    <div class="djet-auth-box" style="text-align: center;">
      <div style="font-size: 3rem; margin-bottom: 1rem;"></div>
      <h1 style="color: var(--danger); font-size: 1.35rem; margin-bottom: 0.75rem;">
        {% trans "Invitation Expired or Invalid" %}
      </h1>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">
        {{ message|default:_("This single-use invitation link has expired or has already been used.") }}
      </p>
      <a href="{% url 'dashboard-login' %}" class="djet-btn djet-btn-secondary">
        ← {% trans "Return to Staff Login" %}
      </a>
    </div>
  </div>
</body>
</html>
