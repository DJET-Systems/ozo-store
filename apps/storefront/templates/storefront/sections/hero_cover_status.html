{% load i18n %}
<section class="djet-hero-cover-status">
  <div>
    <h1 style="font-size: 1.85rem; font-weight: 800; margin: 0 0 0.5rem; color: var(--text);">
      {% if CURRENT_LANG == 'en' %}{{ section.title_en }}{% else %}{{ section.title_ar }}{% endif %}
    </h1>
    <div style="display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap;">
      <span class="djet-status-pill">
        <span class="djet-repair-live-dot" aria-hidden="true"></span>
        {% if CURRENT_LANG == 'en' %}{{ section.status_en }}{% else %}{{ section.status_ar }}{% endif %}
      </span>
      <span style="font-size: 0.9rem; color: var(--text-muted); display: inline-flex; align-items: center; gap: 0.35rem;">
        <svg class="djet-icon-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span>{% trans "Avg. Preparation: 25-35 mins" %}</span>
      </span>
    </div>
  </div>
  <div>
    <a href="#menu" class="djet-btn djet-btn-primary">
      {% trans "Explore Menu" %}
    </a>
  </div>
</section>
