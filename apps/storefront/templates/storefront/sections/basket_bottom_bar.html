{% load i18n %}
{% if cart_count and cart_count > 0 %}
<div class="djet-basket-bottom-bar">
  <div>
    <strong>🧺 {{ preset.cart_label|default:_("Basket") }}</strong>
    <span style="margin-inline-start: 0.5rem; color: var(--text-muted); font-size: 0.9rem;">
      {{ cart_count }} {% trans "items" %}
    </span>
  </div>
  <a href="{% url 'storefront-cart' %}" class="djet-btn djet-btn-primary">
    {% trans "View Basket & Checkout" %} ➔
  </a>
</div>
{% endif %}
