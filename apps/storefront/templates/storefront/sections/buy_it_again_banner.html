{% load i18n %}
<section style="background: var(--surface-alt); border-radius: var(--radius-card); padding: 1.5rem; margin-block: 2rem; border: 1px dashed var(--border);">
  <div style="display: flex; align-items: center; justify-content: space-between;">
    <div style="display: flex; align-items: center; gap: 0.75rem;">
      <span class="djet-trust-icon-box" aria-hidden="true">
        <svg class="djet-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><polyline points="23 20 23 14 17 14"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
      </span>
      <div>
        <strong style="color: var(--text);">
          {% if CURRENT_LANG == 'en' %}{{ section.title_en }}{% else %}{{ section.title_ar }}{% endif %}
        </strong>
        <p style="margin: 0; font-size: 0.85rem; color: var(--text-muted);">
          {% trans "Quickly reorder everyday household and pantry essentials." %}
        </p>
      </div>
    </div>
    <a href="#products" class="djet-btn djet-btn-secondary" style="font-size: 0.85rem; padding: 0.5rem 1rem;">
      {% trans "View Past Items" %}
    </a>
  </div>
</section>
