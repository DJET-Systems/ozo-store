name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: djet_store_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres_ci_password@127.0.0.1:5432/djet_store_test
      TEST_DATABASE_URL: postgresql://postgres:postgres_ci_password@127.0.0.1:5432/djet_store_test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python and dependencies
        run: uv sync --frozen --dev

      - name: Lint and format check (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Full codebase type check (mypy)
        run: uv run mypy apps tests

      - name: Architecture boundary check (import-linter)
        run: uv run lint-imports

      - name: Static security scan (bandit)
        run: uv run bandit -c pyproject.toml -r apps config

      - name: Dependency vulnerability check (pip-audit)
        run: uv run pip-audit --skip-editable

      - name: Django system and migration drift checks
        run: |
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run

      - name: Ledger smoke verification on PostgreSQL
        run: |
          uv run python manage.py migrate
          uv run python manage.py apply_db_grants
          uv run python manage.py load_opening_balance samples/stock_opening_balance.csv
          uv run python manage.py reconcile_stock
          uv run python manage.py expire_reservations

      - name: Run test suite against PostgreSQL
        run: uv run pytest

  compose-smoke:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Prepare ephemeral .env
        run: |
          cp .env.example .env
          sed -i "s/replace-with-50-char-random-secret-key-before-running/$(openssl rand -hex 32)/" .env
          sed -i "s/replace-with-strong-migrator-password/$(openssl rand -hex 16)/g" .env
          sed -i "s/replace-with-strong-app-password/$(openssl rand -hex 16)/g" .env
          sed -i "s/replace-with-strong-ro-password/$(openssl rand -hex 16)/g" .env
          sed -i "s/replace-with-fernet-key/$(python3 -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')/" .env
          chmod 0600 .env

      - name: Build and start Docker Compose stack
        run: |
          docker compose -f deploy/compose.yml --env-file .env up -d --build --wait

      - name: Verify HTTPS storefront and dashboard healthz + isolated cookies
        run: |
          curl -ksS --resolve shop.djet.localhost:443:127.0.0.1 https://shop.djet.localhost/healthz | grep -q '"surface": "storefront"'
          curl -ksS --resolve admin.djet.localhost:443:127.0.0.1 https://admin.djet.localhost/healthz | grep -q '"surface": "dashboard"'
          curl -ksSD - -o /dev/null --resolve shop.djet.localhost:443:127.0.0.1 "https://shop.djet.localhost/?touch_session=1" | grep -qi 'djet_store_sid='
          curl -ksSD - -o /dev/null --resolve admin.djet.localhost:443:127.0.0.1 "https://admin.djet.localhost/?touch_session=1" | grep -qi '__Host-djet_admin_sid='

      - name: Tear down stack
        if: always()
        run: docker compose -f deploy/compose.yml --env-file .env down -v
